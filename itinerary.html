<!DOCTYPE html>
<html lang="zh-TW" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>東京婚紗之旅 2026 | 五日行程總覽</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="切換亮/暗主題">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      <path d="M12 2v20M8 12h16"/>
    </svg>
    <span class="sun">☀</span><span class="moon">🌙</span>
  </button>

  <div class="container">
    <!-- Hero -->
    <header class="hero hero--compact">
      <span class="tag tag--small">五日行程總覽</span>
      <h1>行程時間軸</h1>
      <p class="hero--sub">點選任一天查看該日詳細行程，或切換至地圖查看景點位置。</p>
    </header>

    <!-- 日程日期導覽（橫向滑動） -->
    <section class="card card--date-nav" aria-label="五日行程日期導覽">
      <div class="date-nav-header">
        <h2 class="date-nav-title">📅 五日行程日期導覽</h2>
        <span class="date-nav-hint">橫向滑動查看更多天數</span>
      </div>
      <div class="date-scroll" role="listbox" aria-label="選擇行程日期">
        <!-- 由 JS 動態生成日期卡片 -->
        <div class="date-scroll-track" id="date-scroll-track">
        </div>
      </div>
    </section>

    <!-- 當日行程詳細內容 -->
    <section class="card card--itinerary" id="day-detail-section" aria-label="當日行程詳情">
      <div class="day-header" id="day-header">
        <!-- 由 JS 動態填入 -->
      </div>
      <div class="station-list" id="station-list">
        <!-- 由 JS 動態填入行程項目 -->
      </div>
    </section>

    <!-- 交通資訊（手機版垂直卡片，桌面版表格） -->
    <section class="card card--transport" aria-label="當日交通資訊">
      <h2 class="section-title">🚂 今日交通資訊</h2>
      <div class="transport-list" id="transport-list">
        <!-- 由 JS 動態填入 -->
      </div>
    </section>

  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav" aria-label="主要導覽">
    <a href="index.html" class="nav-item" aria-label="首頁">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="map.html" class="nav-item" aria-label="地圖">
      <svg viewBox="0 0 24 24"><polygon fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="3 6 12 2 21 6 12 23 3 6"/></svg>
      <span class="label">Map</span>
    </a>
    <a href="budget.html" class="nav-item" aria-label="預算">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span class="label">Budget</span>
    </a>
    <a href="info.html" class="nav-item" aria-label="資訊">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span class="label">Info</span>
    </a>
  </nav>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const track = document.getElementById('date-scroll-track');
      const dayHeader = document.getElementById('day-header');
      const stationList = document.getElementById('station-list');
      const transportList = document.getElementById('transport-list');

      if (!window.itinerary || !track) return;

      // ============================================================
      // 建立日期導覽卡片（橫向滑動）
      // ============================================================
      const TYPE_LABELS = {
        airport: '機場',
        hotel: '住宿',
        transport: '交通',
        location: '景點',
        shrine: '神社',
        station: '車站',
        shopping: '購物',
        temple: '寺院',
        restaurant: '餐廳',
        food: '美食',
        activity: '活動'
      };

      const TYPE_COLORS = {
        airport: '#b55444',
        hotel: '#5a725c',
        transport: '#b55444',
        location: '#3498db',
        shrine: '#b58344',
        station: '#8a7d73',
        shopping: '#2c3e50',
        temple: '#b58344',
        restaurant: '#2ecc71',
        food: '#f1c40f',
        activity: '#8a7d73'
      };

      function buildDateCards() {
        let html = '';
        window.itinerary.forEach((day, i) => {
          const isActive = i === 0;
          const stationCount = day.stations.length;
          html += `
            <button class="date-card ${isActive ? 'active' : ''}"
                    type="button"
                    role="option"
                    aria-selected="${isActive}"
                    data-day="${day.id}">
              <div class="date-card-day">Day ${day.id}</div>
              <div class="date-card-date">${day.date}</div>
              <div class="date-card-theme">${day.theme}</div>
              <div class="date-card-count">${stationCount} 個站點</div>
            </button>
          `;
        });
        track.innerHTML = html;

        // 點擊事件
        track.querySelectorAll('.date-card').forEach((card, i) => {
          card.addEventListener('click', () => renderDay(i + 1));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              renderDay(i + 1);
            }
          });
        });
      }

      // ============================================================
      // 渲染指定天數的行程
      // ============================================================
      function renderDay(dayNum) {
        const dayData = window.itinerary.find(d => d.id === dayNum);
        if (!dayData) return;

        // 更新日期卡片 active state
        track.querySelectorAll('.date-card').forEach((card, i) => {
          const active = (i + 1 === dayNum);
          card.classList.toggle('active', active);
          card.setAttribute('aria-selected', active);
        });

        // 日標題
        const stationCount = dayData.stations.length;
        dayHeader.innerHTML = `
          <div class="day-meta">
            <span class="day-badge">Day ${dayData.id}</span>
            <span class="day-date">${dayData.date}</span>
          </div>
          <h1 class="day-title">${dayData.theme}</h1>
          <p class="day-summary">${stationCount} 個行程站點 · ${dayData.weather || ''}</p>
        `;

        // 行程站點列表
        let stationsHtml = '';
        dayData.stations.forEach((station, idx) => {
          const time = station.arriveTime || station.departTime || '--:--';
          const timeLabel = station.arriveTime ? '抵達' : (station.departTime ? '出發' : '--');
          const typeLabel = TYPE_LABELS[station.type] || '站點';
          const typeColor = TYPE_COLORS[station.type] || '#8a7d73';
          const hasCost = station.cost && station.cost.trim() !== '';

          stationsHtml += `
            <div class="station-card" id="station-${dayData.id}-${idx}">
              <button class="station-toggle" type="button"
                      aria-expanded="false"
                      aria-controls="station-detail-${dayData.id}-${idx}"
                      onclick="toggleStation(${dayData.id}, ${idx})">
                <div class="station-row">
                  <div class="station-time">
                    <span class="station-time-val">${time}</span>
                    <span class="station-time-label">${timeLabel}</span>
                  </div>
                  <div class="station-main">
                    <span class="station-type-pill" style="background:${typeColor}20; color:${typeColor}">${typeLabel}</span>
                    <h3 class="station-name">${escapeHtml(station.name)}</h3>
                  </div>
                  <svg class="station-chevron" viewBox="0 0 24 24" width="18" height="18">
                    <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="station-detail-panel" id="station-detail-${dayData.id}-${idx}" hidden>
                  ${renderStationDetails(station, hasCost)}
                </div>
              </button>
            </div>
          `;
        });
        stationList.innerHTML = stationsHtml;

        // 交通資訊
        renderTransport(dayNum);
      }

      // 單一站點的詳細內容（第二層 + 第三層）
      function renderStationDetails(station, hasCost) {
        const typeLabel = TYPE_LABELS[station.type] || '站點';
        let html = '';

        // 第二層：交通方式
        if (station.transport && station.transport.trim()) {
          html += `
            <div class="detail-row">
              <span class="detail-label">🚇 交通方式</span>
              <span class="detail-value">${escapeHtml(station.transport)}</span>
            </div>
          `;
        }

        // 費用（重要資訊，不隱藏）
        if (hasCost) {
          html += `
            <div class="detail-row detail-row--cost">
              <span class="detail-label">💰 預估費用</span>
              <span class="detail-value cost-value">${escapeHtml(station.cost)}</span>
            </div>
          `;
        }

        // 第三層：完整詳情（展開後顯示）
        if (station.detail && station.detail.trim()) {
          html += `
            <div class="detail-row detail-row--expandable">
              <span class="detail-label">📝 詳細說明</span>
              <span class="detail-value detail-value--text">${escapeHtml(station.detail)}</span>
            </div>
          `;
        }

        return html;
      }

      // 交通資訊列表（手機版垂直卡片）
      function renderTransport(dayNum) {
        const dayData = window.itinerary.find(d => d.id === dayNum);
        if (!dayData) return;

        let html = '';
        const seen = new Set();
        dayData.stations.forEach(station => {
          if (station.type === 'transport' && !seen.has(station.name + dayData.id)) {
            seen.add(station.name + dayData.id);
            const time = station.arriveTime || station.departTime || '--:--';
            html += `
              <div class="transport-card">
                <div class="transport-from-to">
                  <span class="transport-time">${time}</span>
                  <span class="transport-name">${escapeHtml(station.name)}</span>
                </div>
                <div class="transport-detail">${escapeHtml(station.transport)}</div>
                ${station.cost ? `<div class="transport-cost">💰 ${escapeHtml(station.cost)}</div>` : ''}
              </div>
            `;
          }
        });
        transportList.innerHTML = html || '<p class="empty-msg">今日無交通移動安排</p>';
      }

      // ============================================================
      // 展開/收合單一站點詳情
      // ============================================================
      window.toggleStation = function(dayId, idx) {
        const card = document.getElementById(`station-${dayId}-${idx}`);
        const toggle = card.querySelector('.station-toggle');
        const panel = card.querySelector('.station-detail-panel');
        const chevron = card.querySelector('.station-chevron');
        const expanded = toggle.getAttribute('aria-expanded') === 'true';

        toggle.setAttribute('aria-expanded', !expanded);
        panel.hidden = expanded;
        chevron.style.transform = expanded ? 'rotate(0deg)' : 'rotate(180deg)';
      };

      // HTML 轉義，防止 XSS 並保留原始文字
      function escapeHtml(text) {
        if (!text) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // 初始化
      buildDateCards();
      renderDay(1);
    });
  </script>
</body>
</html>
